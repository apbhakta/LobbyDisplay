services:
  - type: web
    name: hotel-lobby-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: hotel_lobby
      - key: CORS_ORIGINS
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
